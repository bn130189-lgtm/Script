<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Đăng Ký - Bin Gaming</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --yt-color: #ff0000;
            --tt-color: #010101;
            --success-color: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(255, 65, 108, 0.3);
        }
        h2 {
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .task-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .task-box.completed {
            border-color: var(--success-color);
            background: #ecfdf5;
        }
        .task-info {
            text-align: left;
        }
        .task-info h4 {
            color: #334155;
            font-size: 15px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-info p {
            font-size: 12px;
            color: #94a3b8;
        }
        .task-box.completed .task-info p {
            color: #059669;
            font-weight: 600;
        }
        .btn-task {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
            color: white;
            white-space: nowrap;
        }
        .btn-yt { background-color: var(--yt-color); }
        .btn-yt:hover { background-color: #cc0000; }
        
        .btn-tt { background-color: var(--tt-color); }
        .btn-tt:hover { background-color: #333333; }

        .btn-task.done {
            background-color: var(--success-color) !important;
            pointer-events: none;
        }

        .btn-next-container {
            margin-top: 24px;
        }
        .btn-next {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            transition: all 0.3s ease;
            box-shadow: none;
        }
        .btn-next.active {
            background-color: var(--success-color);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-next.active:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Bước làm nhiệm vụ -->
        <div id="task-view">
            <div class="avatar-box">🎮</div>
            <h2>Xác Nhận Nhiệm Vụ</h2>
            <p class="subtitle">Hoàn thành đủ 2 bước bên dưới để mở khóa nút tiếp tục.</p>

            <!-- Mục 1: YouTube -->
            <div class="task-box" id="box-yt">
                <div class="task-info">
                    <h4>🔴 Đăng ký YouTube</h4>
                    <p id="desc-yt">Chưa đăng ký</p>
                </div>
                <a href="https://youtube.com/@binngamingg?si=DiC2PvPzceaba-yY" target="_blank" class="btn-task btn-yt" id="btn-yt" onclick="verifyYouTube()">Đăng ký</a>
            </div>

            <!-- Mục 2: TikTok -->
            <div class="task-box" id="box-tt">
                <div class="task-info">
                    <h4>🖤 Theo dõi TikTok</h4>
                    <p id="desc-tt">Chưa theo dõi</p>
                </div>
                <a href="https://www.tiktok.com" target="_blank" class="btn-task btn-tt" id="btn-tt" onclick="verifyTikTok()">Theo dõi</a>
            </div>

            <!-- Mục 3: Tiếp tục -->
            <div class="btn-next-container">
                <button class="btn-next" id="btnNext" disabled onclick="nextStep()">Tiếp Tục</button>
            </div>
        </div>

        <!-- Trang thành công sau khi bấm Tiếp tục -->
        <div id="success-view" class="hidden">
            <div class="avatar-box" style="background: var(--success-color);">✨</div>
            <h2>Thành Công!</h2>
            <p class="subtitle" style="margin-bottom: 20px;">Cảm ơn bạn đã đăng ký kênh của Bin Gaming.</p>
            <button class="btn-next active" onclick="location.reload()">Làm lại từ đầu</button>
        </div>
    </div>

    <script>
        let ytDone = false;
        let ttDone = false;

        function verifyYouTube() {
            const btn = document.getElementById('btn-yt');
            const desc = document.getElementById('desc-yt');
            const box = document.getElementById('box-yt');

            desc.innerText = "Đang xác thực...";
            
            // Giả lập thời gian để người dùng thực hiện thao tác đăng ký trên Youtube
            setTimeout(() => {
                ytDone = true;
                btn.innerText = "Đã xong ✓";
                btn.classList.add('done');
                desc.innerText = "Đã hoàn thành";
                box.classList.add('completed');
                checkStatus();
            }, 2000);
        }

        function verifyTikTok() {
            const btn = document.getElementById('btn-tt');
            const desc = document.getElementById('desc-tt');
            const box = document.getElementById('box-tt');

            desc.innerText = "Đang xác thực...";

            setTimeout(() => {
                ttDone = true;
                btn.innerText = "Đã xong ✓";
                btn.classList.add('done');
                desc.innerText = "Đã hoàn thành";
                box.classList.add('completed');
                checkStatus();
            }, 2000);
        }

        function checkStatus() {
            if (ytDone && ttDone) {
                const nextBtn = document.getElementById('btnNext');
                nextBtn.disabled = false;
                nextBtn.classList.add('active'); // Chuyển sang màu xanh lá chuẩn yêu cầu
            }
        }

        function nextStep() {
            if (ytDone && ttDone) {
                document.getElementById('task-view').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');
            }
        }
    </script>
</body>
  </html>
